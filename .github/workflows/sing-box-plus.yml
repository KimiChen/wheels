# sing-box-plus 的验证门禁。
#
# 存在的理由很具体：scripts/check-sensitive.sh 在 2026-09-15 起连续失败了三天而无人察觉，
# 因为没有任何东西在每次提交后重跑门禁。本工作流只做一件事——把 scripts/verify.sh 跑完。
#
# 刻意只有一个 job 而不是拆快慢两档：本仓库提交频率低，一次跑满十几分钟换「绿色即真绿」
# 更划算；拆档会让人以为快档绿了就没事。
#
# 同样刻意不设置 SING_BOX_PLUS_SKIP_UPSTREAM_DRIFT 与 UPSTREAM_REPOSITORY：
# 不设即走规范地址，这是唯一能真正证明上游没漂移的一种；设了任一个，verify.sh 会把
# 结论降级为「仅对镜像」或「未检查」，那时 CI 的绿色就不再支撑「上游未漂移」这句话。

name: sing-box-plus

on:
  push:
    paths:
      - 'sing-box-plus/**'
      - '.github/workflows/sing-box-plus.yml'
  pull_request:
    paths:
      - 'sing-box-plus/**'
      - '.github/workflows/sing-box-plus.yml'
  # 上游漂移检查与注入点普查只会随时间腐烂，不会随提交腐烂——低提交频率的仓库
  # 正是定时任务最有价值的地方。
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: sing-box-plus

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Go 版本以 upstream.lock 为唯一来源。写死在 YAML 里等于多一处会漂移的地方，
      # 而 upstream.lock 本来就是这个项目记录「已验证工具链」的地方。
      - name: 读取 upstream.lock 中已验证的 Go 版本
        id: toolchain
        run: |
          version="$(sed -n 's/^go_verified=//p' upstream.lock)"
          [ -n "$version" ] || { echo "upstream.lock 缺少 go_verified" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache-dependency-path: sing-box-plus/go.sum

      - name: 完整验证
        run: bash scripts/verify.sh
