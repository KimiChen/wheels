# 这份配置是**测出来的，不是挑出来的**。
#
# 背景：从 M0 到 M4 的代码一直是手写换行，仓库里没有 rustfmt.toml，
# 于是 `cargo fmt --check` 对 70 个文件全部报差异——这道检查一直没有实际作用。
#
# 试过用配置去复现现状，结论是**做不到**，而且不是「还差几个参数」：
# `src/quota/converge.rs` 里相邻两行、同样的 `let` + 方法链，
# 94 列的那行留在一行，90 列的那行却被拆成两行。
# 保住前者需要阈值 ≥ 94，拆开后者需要阈值 < 90，两者不可兼得。
# 代码本身就不自洽，所以没有任何宽度配置能复现它。
# 参数扫描的地板是 213 处差异 / 52 个文件（默认配置是 656 处 / 70 个文件）。
#
# 既然要一次全量格式化，配置就按**最接近作者本意**的那组取，而不是取默认值：
#
# - `max_width = 100`：扫描里 90 / 100 / 110 / 120 四个值中 100 的差异最少，
#   说明这就是代码原本瞄准的行宽。
# - `use_small_heuristics = "Max"`：默认值会把结构体字面量、方法链、
#   结构体变体逐个炸成多行。这份代码通篇是「放得下就放一行」的写法，
#   用默认值等于推翻作者的可读性取舍，改动量也从 213 处涨到 656 处。
#
# `reorder_imports` / `reorder_modules` 保持默认的开启：关掉只省 10 处差异，
# 而让 rustfmt 排序是净收益。
max_width = 100
use_small_heuristics = "Max"
