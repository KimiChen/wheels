# proxy-manager 主控配置示例（README §5）。
# 真实配置放 /etc/proxy-manager/server.toml；本文件只含 RFC 保留段示例值。
#
# 字节量一律写**十进制字符串**：TOML 整数是有符号 64 位，而额度口径是 u64（C3、C31）。

[listen]
# 结构化 HTTP API 与 Web 控制台。绑在回环，公网访问经本机反代。
api = "127.0.0.1:8173"

[storage]
# SQLite 单写者（D8）。WAL 可用于并发读，但不增加写入者数量。
path = "/var/lib/proxy-manager/proxy-manager.db"
busy_timeout_ms = 5000

[collect]
# 目标采集周期。提频时会缩短到 min_interval_secs，API 显示实际采集间隔（README §4.5）。
interval_secs = 60
min_interval_secs = 10
# 正额度请求发送前检查快照新鲜度，默认目标采集周期的两倍（README §4.5 下发纪律 3）。
snapshot_max_age_secs = 120
# 节点时钟偏移容忍上限。超出即归桶回落到 received_at 并告警（C27）。
# 节点必须启用 NTP：慢约两分钟会让 SS-2022 的时间戳防重放把**整节点**打成不可用。
max_clock_skew_secs = 120

[quota]
# 额度**不在这里**：分档之后（定案第三条）它挂在 quota_groups 上，建库时按
# 普通 1 TB / Advanced 2 TB / Manage 5 TB / Admin 10 TB（十进制）种下，
# 之后一律走 PUT /api/v1/settings/quota 的审计路径修改——那条路径会推进
# revision 并生成逐节点下发任务。配置里再留一个额度字段就是设了也不生效。
# 日桶按这个展示时区的日历日计算（data-model.md §6）。
# 计费周期是 UTC+8（CYCLE_RULE_VERSION = 2），这里要与之对齐，
# 否则某一天的用量会显示进「错误的月份」。改展示时区必须完整重建日缓存。
display_timezone = "Asia/Shanghai"

# 拿不到新鲜已结算 sequence 时是否下发 C33 的全零安全表。
# 默认 false 是**对一条编号约束的有意偏离**（D25），不是疏漏：
# 节点侧 admit() 先查 exhausted() 再查 stale，所以 stale_action=allow
# 救不了被置零的身份——一次短暂的采集失败会把人硬切断，而镜像分配下
# 节点上那份额度本来就等于全局剩余，不存在「跑到自己耗尽」。
# 置 true 即回到 C33 的原行为。
safe_zero_on_stale = false

[alerts]
# 通知降级通道与限频属于 M5，这里只保留占位键，解析时校验但不使用。
enabled = false

[im]
# 飞书 / 企业微信只做两件事：告警与日报推送、扫码登录与通讯录 RBAC（README §4.9、§4.10）。
# 主控**不暴露任何 IM 事件回调端点**（D5）。实现属于 M5。
enabled = false

# 泡游 SSO 登录（README §4.9、D27）。**整段缺省即不启用**——没有第二个开关。
# 一个 `enabled = false` 配上三条写好的 URL，会让「这套配置到底生不生效」
# 变成要读两处才答得出的问题；把整段注释掉表达同一件事，且不可能读错。
#
# 不启用时登录端点不挂载（404 而不是一个会 500 的按钮），控制台只剩 break-glass。
[sso]
# 用户被 302 到这里完成登录。
login_url = "https://account.xmpaoyou.com/sso"
# 服务端换取身份的端点。接入说明只写了路径，base 是「双方约定」，
# 所以这里是完整 URL——拼接会让改 base 变成改代码。
check_token_url = "https://account.xmpaoyou.com/api/sso/check-token"
# 主控**对外**的基址，回调地址 = 它 + /auth/sso/callback。
# 主控自己绑回环，对外域名由反代决定，所以这个值代码推不出来。
# 必须 https：会话 cookie 带 __Host- 前缀，而该前缀要求 Secure，
# 在明文源上浏览器会直接丢弃——表现是「登录成功但立刻又没登录」。
public_base_url = "https://proxy-manager.example.com"

# state 的有效期（秒）。
state_ttl_secs = 300
# 换取身份那一次外呼的总超时（秒）。连接超时取 min(3, 它)。
request_timeout_secs = 8
# 会话有效期（秒）。**它同时是上游撤权的生效上界**（D27）：
# 泡游没有「按账号查状态」的接口，一个人在泡游侧被停用之后，
# 主控要到会话过期才会发现。名单内的角色/档位调整不受此限——
# 那部分每请求从本文件现解析，改完下一个请求即生效。
session_ttl_secs = 28800

# 控制台管理员。**与额度档位是两件事**：档位管流量多少，这里管能不能改别人的配置。
# 两份名单允许完全不重叠。
#
# 条目可以是泡游账号名，也可以写成 "fs:<飞书标识>" 按飞书标识匹配。
# 两种都支持是因为账号名在上游改名后会变，而
# 「第一个管理员登不进来」是这条路径上唯一不可自愈的故障——
# 它发生时没有任何人能进控制台去改。
#
# **大小写敏感**，且不允许含空白：名单是逐字节比较的。
admins = ["zhangsan"]

# 额度档位名单（D23）。键必须是 normal / advanced / manage / admin 四者之一，
# 未列出者落 normal。同一个人不得出现在两档——那时「按哪一档算」没有答案。
[sso.quota_groups]
advanced = []
manage = []
admin = []
