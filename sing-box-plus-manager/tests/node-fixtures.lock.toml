# 跨仓库契约的 §2.2 三元组：节点实现 commit + 协议版本 + 对应链路的 fixture 摘要。
#
# 三者缺一不可（docs/integration-contract.md §2.2）：
# 只记版本号不够——同一个版本号下 fixture 可能已经变了；
# 只记 commit 也不够——它不能告诉你主控当时按哪份 fixture 验的。
#
# 这份锁由 tests/m0/fixture_lock.rs 强制。上游一改，用例就红，
# 修复方式是**核对变化并更新本文件**，不是在主控里加一个兼容分支。

