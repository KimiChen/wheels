{{define "admin/dashboard.html"}}
<section data-admin-panel="dashboard" aria-labelledby="dashboard-title">
  <div class="fa-page-heading"><div><p class="fa-eyebrow">OVERVIEW</p><h1 id="dashboard-title">工作台</h1><p id="overview-updated">正在读取节点状态…</p></div><div class="fa-page-actions"><button class="wsk-button wsk-secondary" type="button" data-refresh><svg class="wsk-icon" aria-hidden="true"><use href="#icon-refresh"/></svg>刷新</button><button class="wsk-button fa-primary" type="button" data-add-node><svg class="wsk-icon" aria-hidden="true"><use href="#plus"/></svg>添加节点</button></div></div>
  <div class="fa-overview-stats" aria-label="节点状态汇总">
    <button class="wsk-panel fa-stat" type="button" data-node-filter="all"><span>全部节点<strong data-overview-count="total">—</strong></span><svg class="wsk-icon" aria-hidden="true"><use href="#server"/></svg></button>
    <button class="wsk-panel fa-stat" type="button" data-node-filter="online"><span><i class="fa-status-dot" aria-hidden="true"></i>监控在线<strong data-overview-count="online">—</strong></span><small>在线</small></button>
    <button class="wsk-panel fa-stat" type="button" data-node-filter="offline"><span><i class="fa-status-dot" data-state="offline" aria-hidden="true"></i>监控离线<strong data-overview-count="offline">—</strong></span><small>离线</small></button>
    <button class="wsk-panel fa-stat" type="button" data-node-filter="waiting"><span><i class="fa-status-dot" data-state="waiting" aria-hidden="true"></i>等待接入<strong data-overview-count="waiting">—</strong></span><small>等待</small></button>
  </div>
  <div class="fa-overview-tasks" aria-label="快捷检查">
    <button class="wsk-panel fa-task" type="button" data-node-filter="offline"><span class="fa-task-icon" data-tone="danger"><svg class="wsk-icon" aria-hidden="true"><use href="#activity"/></svg></span><span><strong><span data-overview-count="offline">—</span> 个节点离线</strong><small>查看连接与最近报告</small></span><span aria-hidden="true">↗</span></button>
    <button class="wsk-panel fa-task" type="button" data-node-filter="due"><span class="fa-task-icon" data-tone="warning"><svg class="wsk-icon" aria-hidden="true"><use href="#calendar"/></svg></span><span><strong><span data-overview-count="due">—</span> 个节点 7 天内到期</strong><small id="expiry-task-copy">检查续费时间</small></span><span aria-hidden="true">↗</span></button>
    <button class="wsk-panel fa-task" type="button" id="review-shortcut"><span class="fa-task-icon"><svg class="wsk-icon" aria-hidden="true"><use href="#link"/></svg></span><span><strong><span data-overview-count="review">—</span> 个节点 FRP 需核对</strong><small id="review-task-copy">检查绑定与服务端登记</small></span><span aria-hidden="true">↗</span></button>
  </div>
  <div class="fa-dashboard-grid">
    <section class="wsk-panel fa-overview-panel" aria-labelledby="attention-title"><div class="fa-panel-heading"><h2 id="attention-title">需要关注 <span id="attention-count" class="fa-muted">—</span></h2><div class="fa-actions"><button id="expired-shortcut" class="wsk-button wsk-secondary fa-small-button" type="button" data-node-filter="expired" hidden>已到期</button><button class="wsk-button wsk-secondary fa-small-button" type="button" data-node-filter="all">全部节点 ↗</button></div></div><p class="fa-muted fa-panel-description">优先显示已到期、离线和即将到期的节点。</p><div id="attention-list" class="fa-attention-list"></div><p id="attention-empty" class="fa-empty">等待节点快照…</p></section>
    <section class="wsk-panel fa-overview-panel fa-calendar" aria-labelledby="calendar-title"><div class="fa-panel-heading"><h2 id="calendar-title">到期日历</h2><button id="calendar-today" class="wsk-button wsk-secondary fa-small-button" type="button">本月</button></div><div class="fa-calendar-heading"><button id="calendar-prev" class="wsk-icon-button fa-icon" type="button" aria-label="上个月">‹</button><strong id="calendar-month"></strong><button id="calendar-next" class="wsk-icon-button fa-icon" type="button" aria-label="下个月">›</button></div><div class="fa-calendar-week" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="calendar-days" class="fa-calendar-days" aria-label="选择到期日期"></div><p id="calendar-caption" class="fa-muted">按浏览器时区显示</p><div id="calendar-events" class="fa-calendar-events"></div></section>
  </div>
</section>
{{end}}
