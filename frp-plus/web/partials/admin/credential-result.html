{{define "admin/credential-result.html"}}
<dialog id="credential-result" class="wsk-dialog fa-dialog fa-dialog-small" aria-labelledby="secret-title" hidden><header class="wsk-dialog-head fa-dialog-header"><h2 id="secret-title">保存接入令牌</h2><button class="wsk-icon-button fa-icon" type="button" data-close-dialog aria-label="关闭令牌窗口"><svg class="wsk-icon" aria-hidden="true"><use href="#close"/></svg></button></header><div class="wsk-dialog-body"><p data-dialog-notice class="wsk-alert wsk-info fa-notice" role="status" hidden></p><p>令牌只显示这一次。保存到节点的私有令牌文件后清除。</p><label class="wsk-label" for="secret-id">节点 ID</label><input class="wsk-control" id="secret-id" readonly autocomplete="off"><label class="wsk-label" for="secret-token">节点令牌</label><textarea class="wsk-textarea" id="secret-token" readonly rows="3" autocomplete="off" spellcheck="false"></textarea><div class="fa-dialog-actions"><button id="secret-copy" class="wsk-secondary wsk-button" type="button">复制令牌</button><button id="secret-clear" class="wsk-button fa-primary" type="button">已保存，清除显示</button></div></div></dialog>
{{end}}
