{{define "admin/create-dialog.html"}}
<dialog id="create-dialog" class="wsk-dialog fa-dialog fa-dialog-small" aria-labelledby="create-title"><header class="wsk-dialog-head fa-dialog-header"><h2 id="create-title">添加节点</h2><button class="wsk-icon-button fa-icon" type="button" data-close-dialog aria-label="关闭添加节点"><svg class="wsk-icon" aria-hidden="true"><use href="#close"/></svg></button></header><div class="wsk-dialog-body"><p data-dialog-notice class="wsk-alert wsk-info fa-notice" role="status" hidden></p><p>创建后保存接入令牌，并在对应的 agent 中配置。</p><form id="create-form"><label class="wsk-field"><span class="wsk-label">公开节点名称</span><input class="wsk-control" id="node-name" required maxlength="128" autocomplete="off" placeholder="为节点起一个名称"></label><div class="fa-dialog-actions"><button class="wsk-secondary wsk-button" type="button" data-close-dialog>取消</button><button class="wsk-button fa-primary" type="submit">创建节点</button></div></form></div></dialog>
{{end}}
