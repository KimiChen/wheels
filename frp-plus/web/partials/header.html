{{define "header.html"}}
<header class="wsk-topbar fm-topbar"><div class="fm-topbar-inner">
  <div class="fm-top-brand"><a class="wsk-brand fm-brand" href="/" aria-label="FRP Plus 首页"><span class="wsk-brand-mark fm-brand-mark"><svg class="wsk-icon" aria-hidden="true"><use href="#pulse"/></svg></span><span>FRP <b>Plus</b></span></a>{{if eq .Page "admin"}}<span class="fm-top-label">后台</span>{{end}}</div>
  <div class="fm-top-actions">
    {{if eq .Page "home"}}
    <button id="search-toggle" class="wsk-icon-button fm-search-toggle" data-js-only type="button" aria-label="搜索节点" aria-haspopup="dialog" aria-controls="node-search-dialog" aria-expanded="false" title="搜索节点（⌘ / Ctrl K）"><svg class="wsk-icon" aria-hidden="true"><use href="#search"/></svg></button>
    {{else if eq .Page "node"}}
    <a href="/" class="fm-top-link" aria-label="返回节点列表" title="返回节点列表"><svg class="wsk-icon" aria-hidden="true"><use href="#arrow-left"/></svg><span>返回节点列表</span></a>
    {{else if eq .Page "admin"}}
    <a class="fm-top-link" href="/" aria-label="状态面板" title="状态面板"><svg class="wsk-icon" aria-hidden="true"><use href="#arrow-left"/></svg><span>状态面板</span></a>
    {{end}}
    <button class="wsk-icon-button fm-theme" data-theme-toggle data-js-only type="button" aria-label="切换主题"><svg class="wsk-icon" aria-hidden="true"><use href="#theme"/></svg></button>
    {{if eq .Page "admin"}}
    <button class="wsk-icon-button fm-logout" id="logout" type="button" aria-label="退出管理" title="退出管理" hidden><svg class="wsk-icon" aria-hidden="true"><use href="#exit"/></svg></button>
    {{else}}
    <a class="wsk-icon-button fm-admin" href="/admin/" aria-label="管理工作台" title="管理工作台"><svg class="wsk-icon" aria-hidden="true"><use href="#settings"/></svg></a>
    {{end}}
  </div>
</div></header>
{{end}}
