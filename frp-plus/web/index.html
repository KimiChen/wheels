<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>FRP Plus · 节点总览</title>
  <script src="/assets/theme.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/app.css">
  <script defer src="/assets/script.js"></script>
  <script type="module" src="/src/app.mjs"></script>
</head>
<body class="fm-page fm-home-page">
  <a class="wsk-skip-link" href="#main">跳到主要内容</a>
  <svg class="wsk-icon-sprite fm-symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="pulse" viewBox="0 0 24 24"><path d="M2 13h5l3-9 4 16 3-7h5"/></symbol>
    <symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 4v16"/></symbol>
    <symbol id="server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M12 6.5h5M12 17.5h5"/></symbol>
    <symbol id="theme" viewBox="0 0 24 24"><path d="M20.7 13.5A9 9 0 0 1 10.5 3.3 9 9 0 1 0 20.7 13.5Z"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 1 7M20 3v5h-5"/></symbol>
    <symbol id="arrow-up" viewBox="0 0 24 24"><path d="M12 20V4m-6 6 6-6 6 6"/></symbol>
    <symbol id="arrow-down" viewBox="0 0 24 24"><path d="M12 4v16m-6-6 6 6 6-6"/></symbol>
    <symbol id="cpu" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3"/></symbol>
    <symbol id="memory" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10v4m5-4v4m5-4v4M7 18v3m5-3v3m5-3v3"/></symbol>
    <symbol id="disk" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 14h18m-5 3h2m-11 0h.01"/></symbol>
    <symbol id="plan" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3v10Z"/><path d="M14 2v8h8a8 8 0 0 0-8-8Z"/></symbol>
    <symbol id="cloud-download" viewBox="0 0 24 24"><path d="M7 17H6a4 4 0 0 1-.5-8A6.5 6.5 0 0 1 18 8a4.5 4.5 0 0 1 0 9h-1M12 12v9m-3-3 3 3 3-3"/></symbol>
    <symbol id="cloud-upload" viewBox="0 0 24 24"><path d="M7 17H6a4 4 0 0 1-.5-8A6.5 6.5 0 0 1 18 8a4.5 4.5 0 0 1 0 9h-1M12 21v-9m-3 3 3-3 3 3"/></symbol>
    <symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></symbol>
    <symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  </defs></svg>

  {{template "header.html" .}}
  <main id="main" tabindex="-1">
    <div id="connection-notice" class="wsk-alert wsk-warning fm-notice" role="status" hidden></div>
    <noscript><div class="wsk-alert wsk-warning fm-notice">此页面需要 JavaScript 获取监控数据。当前未显示实时状态。</div></noscript>
    <section id="nodes" class="fm-nodes" aria-labelledby="nodes-title">
      <div class="fm-home-title"><div><p class="fm-eyebrow">INFRASTRUCTURE / OVERVIEW</p><h1 id="nodes-title">节点总览</h1><p class="fm-home-description">查看主机资源、连接状态与流量使用情况。</p></div><span class="fm-refresh-cadence">每 2 秒刷新</span></div>
      <div class="fm-home-summary" aria-label="全部公开节点统计">
        <section class="wsk-panel fm-overview-panel"><div class="fm-section-heading"><h2><svg class="wsk-icon" aria-hidden="true"><use href="#server"/></svg>节点情况</h2><button id="expiry-filter" class="wsk-button wsk-quiet fm-expiry-filter" type="button" aria-pressed="false" title="只查看未来 7 天内到期且已公开到期时间的节点" data-js-only>7 天内到期 <b id="stat-expiring">—</b><span aria-hidden="true">›</span></button></div>
          <div class="fm-status-counts" role="group" aria-label="按连接状态查看">
            <button class="fm-status-filter" type="button" data-status-filter="all" aria-pressed="true"><strong id="stat-total">—</strong><span>全部节点</span></button>
            <button class="fm-status-filter" type="button" data-status-filter="online" aria-pressed="false"><strong id="stat-online">—</strong><span><i class="fm-state-dot" data-state="online" aria-hidden="true"></i>在线</span></button>
            <button class="fm-status-filter" type="button" data-status-filter="offline" aria-pressed="false"><strong id="stat-offline">—</strong><span><i class="fm-state-dot" data-state="offline" aria-hidden="true"></i>离线</span></button>
            <button class="fm-status-filter" type="button" data-status-filter="waiting" aria-pressed="false"><strong id="stat-waiting">—</strong><span><i class="fm-state-dot" data-state="waiting" aria-hidden="true"></i>等待接入</span></button>
          </div>
        </section>
        <section class="wsk-panel fm-overview-panel"><div class="fm-section-heading"><h2><svg class="wsk-icon" aria-hidden="true"><use href="#pulse"/></svg>网络情况</h2><small>全部公开节点</small></div>
          <div class="fm-network-overview" id="fleet-network-rates"><div><span><svg class="wsk-icon" aria-hidden="true"><use href="#arrow-down"/></svg>当前接收</span><strong id="fleet-rx">—</strong></div><div><span><svg class="wsk-icon" aria-hidden="true"><use href="#arrow-up"/></svg>当前发送</span><strong id="fleet-tx">—</strong></div></div>
          <div class="fm-network-cumulative" id="fleet-network-totals"><span>系统累计 <b id="stat-rx-total">—</b></span><span>系统累计 <b id="stat-tx-total">—</b></span></div>
        </section>
      </div>
      <div class="fm-toolbar" data-js-only>
        <div id="node-group-filter" class="fm-group-filter" role="group" aria-label="按节点分组查看" data-js-only></div>
        <button id="clear-search" class="wsk-button wsk-secondary fm-search-filter" type="button" aria-label="清除名称搜索" hidden><span id="search-filter-label"></span><svg class="wsk-icon" aria-hidden="true"><use href="#close"/></svg></button>
        <div class="fm-list-controls">
          <label class="fm-search fm-quick-search"><svg class="wsk-icon" aria-hidden="true"><use href="#search"/></svg><input id="node-quick-search" class="wsk-control" type="search" placeholder="搜索节点" aria-label="按节点名称筛选" autocomplete="off"></label>
          <label class="fm-sort"><span aria-hidden="true"><svg class="wsk-icon" viewBox="0 0 24 24"><path d="M7 3v18m-4-4 4 4 4-4M17 21V3m-4 4 4-4 4 4"/></svg>排序</span><select id="node-sort" class="wsk-select" aria-label="节点排序方式" title="名称、系统和到期按升序，指标按降序；缺失数据排在最后"><option value="default">默认</option></select></label>
          <div class="wsk-view-switch fm-view-switch" role="group" aria-label="展示方式" data-js-only>
            <button class="fm-view-button" data-fm-view="cards" type="button" aria-label="卡片" aria-pressed="true" title="卡片视图"><svg class="wsk-icon" aria-hidden="true"><use href="#grid"/></svg>卡片</button>
            <button class="fm-view-button" data-fm-view="table" type="button" aria-label="表格" aria-pressed="false" title="表格视图"><svg class="wsk-icon" aria-hidden="true"><use href="#table"/></svg>表格</button>
          </div>
          <button id="retry" class="wsk-icon-button fm-refresh" type="button" aria-label="刷新节点" title="刷新节点"><svg class="wsk-icon" aria-hidden="true"><use href="#refresh"/></svg></button>
        </div>
      </div>
      <div class="fm-list-meta"><span id="list-summary" role="status">等待数据</span><button id="clear-filters" class="wsk-button wsk-quiet fm-clear-filters" type="button" hidden>重置筛选</button></div>
      <div id="node-list" class="fm-node-grid" data-fm-layout="cards" role="region" aria-label="节点卡片列表"></div>
      <div id="empty-state" class="wsk-empty-state fm-empty" hidden><span class="wsk-empty-icon fm-empty-icon"><svg class="wsk-icon" aria-hidden="true"><use href="#server"/></svg></span><h2 id="empty-title"></h2><p id="empty-copy"></p></div>
      <div class="fm-list-footer"><span>仅显示已公开的节点信息</span><span>— 表示暂无有效采样</span></div>
    </section>
  </main>
  <dialog id="node-search-dialog" class="wsk-dialog fm-search-dialog" aria-labelledby="search-title">
    <div class="fm-search-dialog-inner">
      <h2 id="search-title" class="wsk-sr-only">搜索节点</h2>
      <header class="wsk-dialog-head fm-search-head"><label class="fm-search"><svg class="wsk-icon" aria-hidden="true"><use href="#search"/></svg><input class="wsk-control" id="node-search" type="search" placeholder="搜索节点名称…" aria-label="搜索节点名称" aria-controls="search-results" aria-describedby="search-summary" autocomplete="off" autofocus></label><button class="wsk-icon-button" type="button" data-dialog-close aria-label="关闭搜索"><svg class="wsk-icon" aria-hidden="true"><use href="#close"/></svg></button></header>
      <div class="fm-search-body"><p id="search-summary" class="fm-search-summary" role="status">正在连接监控服务…</p><ul id="search-results" class="fm-search-results" aria-label="匹配的节点"></ul><p id="search-empty" class="fm-search-empty" hidden>没有匹配的节点。</p></div>
      <footer class="wsk-dialog-foot fm-search-foot"><span>↑ ↓ 选择 · Enter 打开 · Esc 关闭</span><button class="wsk-button wsk-quiet" type="button" data-dialog-close>查看筛选结果</button></footer>
    </div>
  </dialog>
  {{template "footer.html" .}}

  <template id="node-template"><article class="wsk-panel fm-node-card">
    <header class="fm-card-header fm-node-identity">
      <div class="fm-card-heading"><h2><a class="fm-node-link" data-value="name"></a></h2><span class="fm-card-status" data-value="status">—</span></div>
      <div class="fm-card-summary"><p data-value="hardware-short">系统信息待上报</p><span class="fm-card-group" data-value="groups" hidden></span></div>
    </header>
    <div class="wsk-progress-list fm-resource-grid">
      <div class="fm-resource" data-resource="cpu"><span class="fm-resource-label" title="CPU"><svg class="wsk-icon" aria-hidden="true"><use href="#cpu"/></svg><span>CPU</span></span><div class="fm-resource-usage"><strong data-value="cpu">—</strong><small data-value="cpu-capacity">—</small><progress max="100" data-meter="cpu" aria-label="CPU 使用率" hidden></progress></div></div>
      <div class="fm-resource" data-resource="mem"><span class="fm-resource-label" title="内存"><svg class="wsk-icon" aria-hidden="true"><use href="#memory"/></svg><span>内存</span></span><div class="fm-resource-usage"><strong data-value="mem">—</strong><small data-value="mem-capacity">—</small><progress max="100" data-meter="mem" aria-label="内存使用率" hidden></progress></div></div>
      <div class="fm-resource" data-resource="disk"><span class="fm-resource-label" title="存储"><svg class="wsk-icon" aria-hidden="true"><use href="#disk"/></svg><span>存储</span></span><div class="fm-resource-usage"><strong data-value="disk">—</strong><small data-value="disk-capacity">—</small><progress max="100" data-meter="disk" aria-label="存储使用率" hidden></progress></div></div>
      <div class="fm-resource" data-resource="traffic"><span class="fm-resource-label" title="套餐流量"><svg class="wsk-icon" aria-hidden="true"><use href="#plan"/></svg><span>套餐流量</span></span><div class="fm-resource-usage"><strong data-value="traffic">—</strong><small data-value="traffic-capacity">—</small><progress max="100" data-meter="traffic" aria-label="周期流量使用率" hidden></progress></div></div>
    </div>
    <div class="fm-network">
      <div class="fm-receive"><span class="fm-network-direction"><svg class="wsk-icon" aria-hidden="true"><use href="#arrow-down"/></svg><span class="fm-card-only">接收</span><span class="fm-row-only">IN</span></span><strong class="fm-card-only" data-value="rx">—</strong><strong class="fm-row-only fm-network-value"><span data-value="row-rx-rate">—</span><small data-value="row-rx-rate-unit"></small></strong></div>
      <div class="fm-send"><span class="fm-network-direction"><svg class="wsk-icon" aria-hidden="true"><use href="#arrow-up"/></svg><span class="fm-card-only">发送</span><span class="fm-row-only">OUT</span></span><strong class="fm-card-only" data-value="tx">—</strong><strong class="fm-row-only fm-network-value"><span data-value="row-tx-rate">—</span><small data-value="row-tx-rate-unit"></small></strong></div>
    </div>
    <section class="fm-row-info fm-row-totals" aria-label="系统累计流量">
      <h3 class="wsk-sr-only">系统累计流量</h3>
      <dl>
        <div><dt title="系统累计下载，节点重启可能归零"><svg class="wsk-icon" aria-hidden="true"><use href="#cloud-download"/></svg><span aria-hidden="true">↓总</span><span class="wsk-sr-only">累计下载</span></dt><dd class="fm-compact-value"><span data-value="row-rx-total">—</span><small data-value="row-rx-total-unit"></small></dd></div>
        <div><dt title="系统累计上传，节点重启可能归零"><svg class="wsk-icon" aria-hidden="true"><use href="#cloud-upload"/></svg><span aria-hidden="true">↑总</span><span class="wsk-sr-only">累计上传</span></dt><dd class="fm-compact-value"><span data-value="row-tx-total">—</span><small data-value="row-tx-total-unit"></small></dd></div>
      </dl>
    </section>
    <section class="fm-row-info fm-row-lifecycle" aria-label="到期时间与运行时长">
      <h3 class="wsk-sr-only">到期时间与运行时长</h3>
      <dl>
        <div><dt><svg class="wsk-icon" aria-hidden="true"><use href="#calendar"/></svg>到期</dt><dd data-value="row-expiry">—</dd></div>
        <div><dt><svg class="wsk-icon" aria-hidden="true"><use href="#clock"/></svg>运行</dt><dd data-value="row-uptime">—</dd></div>
      </dl>
    </section>
    <footer class="fm-card-footer"><span class="fm-card-footnote"><small data-value="expiry" hidden></small><span class="fm-data-state" data-value="freshness"></span></span><a class="fm-node-link fm-open-node"><span data-value="uptime">—</span><span aria-hidden="true"> ›</span></a></footer>
  </article></template>
</body>
</html>
