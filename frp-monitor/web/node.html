<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>FRP Monitor · 节点详情</title>
  <script src="/assets/theme.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/node.css">
  <script defer src="/assets/script.js"></script>
  <script type="module" src="/src/node.mjs"></script>
</head>
<body class="fm-node-page">
  <a class="wsk-skip-link" href="#main">跳到主要内容</a>
  <svg class="fm-symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="pulse" viewBox="0 0 24 24"><path d="M2 13h5l3-9 4 16 3-7h5"/></symbol>
    <symbol id="server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M12 6.5h5M12 17.5h5"/></symbol>
    <symbol id="theme" viewBox="0 0 24 24"><path d="M20.7 13.5A9 9 0 0 1 10.5 3.3 9 9 0 1 0 20.7 13.5Z"/></symbol>
    <symbol id="settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3h6l1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="arrow-left" viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
    <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 1 7M20 3v5h-5"/></symbol>
  </defs></svg>
  <header class="fm-topbar"><div class="fm-topbar-inner">
    <a class="fm-brand" href="/" aria-label="FRP Monitor 首页"><span class="fm-brand-mark"><svg aria-hidden="true"><use href="#pulse"/></svg></span><span>FRP <b>Monitor</b></span></a>
    <div class="fm-top-actions"><a href="/" class="fm-back"><svg aria-hidden="true"><use href="#arrow-left"/></svg><span>返回节点列表</span></a><button class="wsk-button fm-theme" data-theme-toggle data-js-only type="button" aria-label="切换主题"><svg aria-hidden="true"><use href="#theme"/></svg></button><a class="fm-admin" href="/admin/" aria-label="管理工作台" title="管理工作台"><svg aria-hidden="true"><use href="#settings"/></svg><span>管理</span></a></div>
  </div></header>
  <main id="main" tabindex="-1">
    <div id="connection-notice" class="fm-notice" role="status">正在获取节点快照…</div>
    <noscript><div class="fm-notice">此页面需要 JavaScript 获取节点状态和历史趋势。</div></noscript>
    <section id="node-empty" class="fm-empty" aria-labelledby="empty-title"><span class="fm-empty-icon"><svg aria-hidden="true"><use href="#server"/></svg></span><h1 id="empty-title">正在读取节点</h1><p id="empty-copy">同步当前节点的资源、系统信息与历史记录。</p><button id="retry-empty" class="wsk-button fm-refresh" type="button" data-js-only>重新同步</button></section>
    <article id="node-detail" hidden>
      <header class="fm-node-heading"><div class="fm-node-title"><span class="fm-node-heading-icon"><svg aria-hidden="true"><use href="#server"/></svg></span><div><div class="fm-node-title-line"><h1 data-value="name">—</h1><span class="fm-badge" data-value="session"></span></div><p class="fm-node-meta"><span>运行 <b data-value="uptime">—</b></span><span>Agent <b data-value="agent">—</b></span><span class="fm-data-state" data-value="freshness"></span></p></div></div><button id="retry" class="wsk-button fm-refresh" type="button" data-js-only><svg aria-hidden="true"><use href="#refresh"/></svg>刷新</button></header>
      <dl class="fm-node-overview">
        <div class="fm-node-info"><dt>操作系统</dt><dd data-value="os">—</dd><dd class="fm-node-info-note" data-value="scope">等待资源报告</dd></div>
        <div class="fm-node-info"><dt>处理器</dt><dd data-value="cpu-model">—</dd><dd class="fm-node-info-note">当前 CPU <b data-value="cpu">—</b></dd></div>
        <div class="fm-node-info"><dt>内存 / 硬盘</dt><dd class="fm-capacities"><span><small>内存</small><b data-value="memory">—</b></span><span><small>硬盘</small><b data-value="disk">—</b></span></dd><dd class="fm-node-info-note">已用 / 总容量</dd></div>
        <div class="fm-node-info"><dt>系统环境</dt><dd data-value="environment">—</dd><dd class="fm-node-info-note">进程 <b data-value="processes">—</b> · TCP <b data-value="tcp">—</b> · UDP <b data-value="udp">—</b></dd></div>
        <div class="fm-node-info"><dt>今日流量 <span>UTC</span></dt><dd class="fm-capacities"><span><small>↓ 接收</small><b data-value="traffic-rx">—</b></span><span><small>↑ 发送</small><b data-value="traffic-tx">—</b></span></dd><dd class="fm-node-info-note" id="traffic-note">等待历史记录</dd></div>
        <div class="fm-node-info"><dt>FRP 隧道</dt><dd><b data-value="proxies">—</b><small> 运行 / 已配置</small></dd><dd class="fm-node-info-note" data-value="frp-reconciliation">等待核对</dd></div>
      </dl>
      <p class="fm-node-sampling"><span data-value="sample-time">尚未收到资源报告</span><span data-value="interval">—</span><span>FRP 控制连接 <b data-value="frp">—</b></span></p>
      <section class="fm-node-history" aria-label="节点历史趋势"><div id="node-history"></div></section>
    </article>
  </main>
  <footer class="fm-footer"><div class="fm-footer-inner"><div class="fm-footer-live"><span class="fm-stream" data-state="loading" id="stream-status" role="status"><i></i><span id="stream-label">正在连接</span></span><span class="fm-snapshot">快照 <time id="snapshot-at">—</time></span><span class="fm-node-footer-sample" id="footer-sample">等待节点数据</span></div><span class="fm-footer-brand">FRP Monitor <span class="fm-footer-separator">/</span> 公开 · 只读</span></div></footer>
</body>
</html>
