<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>FRP Monitor · 节点总览</title>
  <script src="/assets/theme.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/app.css">
  <script defer src="/assets/script.js"></script>
  <script type="module" src="/src/app.mjs"></script>
</head>
<body>
  <a class="wsk-skip-link" href="#main">跳到主要内容</a>
  <svg class="wsk-icon-sprite fm-symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="pulse" viewBox="0 0 24 24"><path d="M2 13h5l3-9 4 16 3-7h5"/></symbol>
    <symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 4v16"/></symbol>
    <symbol id="settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1 1 3-2 2 2 2-1 3 3 1 1 3h6l1-3 3-1-1-3 2-2-2-2 1-3-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M12 6.5h5M12 17.5h5"/></symbol>
    <symbol id="theme" viewBox="0 0 24 24"><path d="M20.7 13.5A9 9 0 0 1 10.5 3.3 9 9 0 1 0 20.7 13.5Z"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 1 7M20 3v5h-5"/></symbol>
    <symbol id="arrow-up" viewBox="0 0 24 24"><path d="M12 20V4m-6 6 6-6 6 6"/></symbol>
    <symbol id="arrow-down" viewBox="0 0 24 24"><path d="M12 4v16m-6-6 6 6 6-6"/></symbol>
  </defs></svg>

  <header class="wsk-topbar fm-topbar"><div class="fm-topbar-inner">
    <a class="wsk-brand fm-brand" href="/" aria-label="FRP Monitor 首页"><span class="wsk-brand-mark fm-brand-mark"><svg class="wsk-icon" aria-hidden="true"><use href="#pulse"/></svg></span><span>FRP <b>Monitor</b></span></a>
    <div class="fm-top-actions">
      <div class="wsk-view-switch fm-view-switch" role="group" aria-label="展示方式" data-js-only>
        <button class="fm-view-button" data-fm-view="cards" type="button" aria-label="卡片" aria-pressed="true"><svg class="wsk-icon" aria-hidden="true"><use href="#grid"/></svg>卡片</button>
        <button class="fm-view-button" data-fm-view="table" type="button" aria-label="表格" aria-pressed="false"><svg class="wsk-icon" aria-hidden="true"><use href="#table"/></svg>表格</button>
      </div>
      <button id="search-toggle" class="wsk-icon-button fm-search-toggle" data-js-only type="button" aria-label="搜索节点" aria-haspopup="dialog" aria-controls="node-search-dialog" aria-expanded="false" title="搜索节点（⌘ / Ctrl K）"><svg class="wsk-icon" aria-hidden="true"><use href="#search"/></svg></button>
      <button class="wsk-icon-button fm-theme" data-theme-toggle data-js-only type="button" aria-label="切换主题"><svg class="wsk-icon" aria-hidden="true"><use href="#theme"/></svg></button>
      <a class="wsk-button wsk-secondary fm-admin" href="/admin/" aria-label="管理工作台" title="管理工作台"><svg class="wsk-icon" aria-hidden="true"><use href="#settings"/></svg><span>管理</span></a>
    </div>
  </div></header>
  <main id="main" tabindex="-1">
    <div id="connection-notice" class="wsk-alert wsk-warning fm-notice" role="status" hidden></div>
    <noscript><div class="wsk-alert wsk-warning fm-notice">此页面需要 JavaScript 获取监控数据。当前未显示实时状态。</div></noscript>
    <section id="nodes" class="fm-nodes" aria-labelledby="nodes-title">
      <h1 id="nodes-title" class="wsk-sr-only">节点群</h1>
      <div class="fm-fleet-stats" aria-label="全部公开节点统计">
        <section class="wsk-panel fm-stat-card" data-stat="total"><h2>服务器总数</h2><div class="fm-stat-value"><i aria-hidden="true"></i><strong id="stat-total">—</strong><small id="stat-waiting-note" hidden><b id="stat-waiting">—</b> 等待接入</small></div></section>
        <section class="wsk-panel fm-stat-card" data-stat="online"><h2>在线服务器</h2><div class="fm-stat-value"><i aria-hidden="true"></i><strong id="stat-online">—</strong></div></section>
        <section class="wsk-panel fm-stat-card" data-stat="offline"><h2>离线服务器</h2><div class="fm-stat-value"><i aria-hidden="true"></i><strong id="stat-offline">—</strong></div></section>
        <section class="wsk-panel fm-stat-card fm-stat-network"><h2>网络</h2><div class="fm-stat-totals" id="fleet-network-totals"><span class="fm-upload" aria-label="系统累计上传">↑ <b id="stat-tx-total">—</b></span><span class="fm-download" aria-label="系统累计下载">↓ <b id="stat-rx-total">—</b></span></div><div class="fm-stat-rates" id="fleet-network-rates"><span aria-label="当前上传速率"><svg class="wsk-icon" aria-hidden="true"><use href="#arrow-up"/></svg><b id="fleet-tx">—</b></span><span aria-label="当前下载速率"><svg class="wsk-icon" aria-hidden="true"><use href="#arrow-down"/></svg><b id="fleet-rx">—</b></span></div></section>
      </div>
      <div class="fm-toolbar" data-js-only>
        <div id="node-group-filter" class="fm-group-filter" role="group" aria-label="按节点分组查看" data-js-only></div>
        <button id="clear-search" class="wsk-button wsk-secondary fm-search-filter" type="button" aria-label="清除名称搜索" hidden><span id="search-filter-label"></span><svg class="wsk-icon" aria-hidden="true"><use href="#close"/></svg></button>
        <div class="fm-list-controls">
          <label class="fm-sort"><span aria-hidden="true"><svg class="wsk-icon" viewBox="0 0 24 24"><path d="M7 3v18m-4-4 4 4 4-4M17 21V3m-4 4 4-4 4 4"/></svg>Sort</span><select id="node-sort" class="wsk-select" aria-label="节点排序方式" title="名称和系统按升序，指标按降序；缺失指标排在最后"><option value="default">默认</option></select></label>
          <button id="retry" class="wsk-icon-button fm-refresh" type="button" aria-label="刷新节点" title="刷新节点"><svg class="wsk-icon" aria-hidden="true"><use href="#refresh"/></svg></button>
        </div>
      </div>
      <div id="node-list" class="fm-node-grid"></div>
      <div id="table-view" class="wsk-table-wrap fm-table-wrap" role="region" aria-label="节点资源表，可横向滚动" tabindex="0" hidden>
        <table class="wsk-table fm-table"><caption class="wsk-sr-only">节点实时资源与连接状态</caption><thead><tr><th scope="col">节点</th><th scope="col">状态</th><th scope="col">CPU</th><th scope="col">内存</th><th scope="col">存储</th><th scope="col">发送 / 接收</th><th scope="col">负载</th><th scope="col">运行时间</th><th scope="col">详情</th></tr></thead><tbody id="node-table-body"></tbody></table>
      </div>
      <div id="empty-state" class="wsk-empty-state fm-empty" hidden><span class="wsk-empty-icon fm-empty-icon"><svg class="wsk-icon" aria-hidden="true"><use href="#server"/></svg></span><h2 id="empty-title"></h2><p id="empty-copy"></p></div>
      <div class="fm-list-footer"><span id="list-summary">等待数据</span><span>— 表示暂无有效采样</span></div>
    </section>
  </main>
  <dialog id="node-search-dialog" class="wsk-dialog fm-search-dialog" aria-labelledby="search-title">
    <div class="fm-search-dialog-inner">
      <h2 id="search-title" class="wsk-sr-only">搜索节点</h2>
      <header class="wsk-dialog-head fm-search-head"><label class="fm-search"><svg class="wsk-icon" aria-hidden="true"><use href="#search"/></svg><input class="wsk-control" id="node-search" type="search" placeholder="搜索节点名称…" aria-label="搜索节点名称" aria-controls="search-results" aria-describedby="search-summary" autocomplete="off" autofocus></label><button class="wsk-icon-button" type="button" data-dialog-close aria-label="关闭搜索"><svg class="wsk-icon" aria-hidden="true"><use href="#close"/></svg></button></header>
      <div class="fm-search-body"><p id="search-summary" class="fm-search-summary" role="status">正在连接监控服务…</p><ul id="search-results" class="fm-search-results" aria-label="匹配的节点"></ul><p id="search-empty" class="fm-search-empty" hidden>没有匹配的节点。</p></div>
      <footer class="wsk-dialog-foot fm-search-foot"><span>↑ ↓ 选择 · Enter 打开 · Esc 关闭</span><button class="wsk-button wsk-quiet" type="button" data-dialog-close>查看筛选结果</button></footer>
    </div>
  </dialog>
  <footer class="fm-footer"><div class="fm-footer-inner"><div class="fm-footer-live">
    <span class="fm-stream" data-state="pending" id="stream-status" role="status"><i></i><span id="stream-label"></span></span>
    <span class="fm-snapshot">快照 <time id="snapshot-at">—</time></span>
    <span id="stat-cpu-note">均 CPU <b id="stat-cpu">—</b></span>
    <span id="stat-network-note"><span title="节点发送总速率">↑ <b id="stat-tx">—</b></span><span title="节点接收总速率">↓ <b id="stat-rx">—</b></span></span>
  </div><span class="fm-footer-brand">FRP Monitor <span class="fm-footer-separator">/</span> 公开 · 只读</span></div></footer>

  <template id="node-template"><article class="wsk-panel fm-node-card">
    <header class="fm-card-header fm-node-identity">
      <div class="fm-card-heading"><h2><a class="fm-node-link" data-value="name"></a></h2><span class="wsk-badge fm-badge" data-value="session"></span></div>
      <div class="fm-card-summary"><p data-value="hardware">系统信息待上报</p><small data-value="uptime">—</small></div>
    </header>
    <div class="wsk-progress-list fm-resource-grid">
      <div class="fm-resource"><div class="fm-resource-usage"><span class="fm-resource-label" data-value="cpu-label">CPU</span><strong data-value="cpu">—</strong><progress max="100" data-meter="cpu" aria-label="CPU 使用率" hidden></progress></div></div>
      <div class="fm-resource"><div class="fm-resource-usage"><span class="fm-resource-label" data-value="mem-label">内存 —</span><strong data-value="mem">—</strong><progress max="100" data-meter="mem" aria-label="内存使用率" hidden></progress></div></div>
      <div class="fm-resource"><div class="fm-resource-usage"><span class="fm-resource-label" data-value="disk-label">存储 —</span><strong data-value="disk">—</strong><progress max="100" data-meter="disk" aria-label="存储使用率" hidden></progress></div></div>
      <div class="fm-resource"><div class="fm-resource-usage"><span class="fm-resource-label" data-value="traffic-label">流量 —</span><strong data-value="traffic">—</strong><progress max="100" data-meter="traffic" aria-label="周期流量使用率" hidden></progress></div></div>
    </div>
    <div class="fm-network"><div><span><svg class="wsk-icon" aria-hidden="true"><use href="#arrow-down"/></svg>接收</span><strong data-value="rx">—</strong></div><div><span><svg class="wsk-icon" aria-hidden="true"><use href="#arrow-up"/></svg>发送</span><strong data-value="tx">—</strong></div></div>
    <footer class="fm-card-footer"><span class="fm-data-state" data-value="freshness"></span><a class="fm-node-link fm-open-node">详情 →</a></footer>
  </article></template>
  <template id="row-template"><tr class="fm-table-row">
    <th scope="row"><a class="wsk-button wsk-quiet fm-detail-link" data-value="name"></a><small data-value="hardware"></small><small class="fm-node-groups" data-value="groups"></small></th>
    <td><span class="wsk-badge fm-badge" data-value="session"></span><small class="fm-data-state" data-value="freshness"></small></td>
    <td class="wsk-progress-list fm-resource"><strong data-value="cpu">—</strong><progress max="100" data-meter="cpu" aria-label="CPU 使用率" hidden></progress><small data-value="cpu-note"></small></td>
    <td class="wsk-progress-list fm-resource"><strong data-value="mem">—</strong><progress max="100" data-meter="mem" aria-label="内存使用率" hidden></progress><small data-value="mem-note"></small></td>
    <td class="wsk-progress-list fm-resource"><strong data-value="disk">—</strong><progress max="100" data-meter="disk" aria-label="存储使用率" hidden></progress><small data-value="disk-note"></small></td>
    <td class="fm-table-network"><span>↑ <b data-value="tx">—</b></span><span>↓ <b data-value="rx">—</b></span></td>
    <td><span data-value="load">—</span><small>1 / 5 / 15 分钟</small></td>
    <td data-value="uptime">—</td>
    <td><a class="wsk-button wsk-quiet fm-detail-link">详情 →</a></td>
  </tr></template>
</body>
</html>
