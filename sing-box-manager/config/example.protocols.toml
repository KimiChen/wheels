# Shadowsocks-2022 模板。auto 按 listener/Node 的逻辑资源分别生成稳定密钥。
[protocols.shadowsocks]
method = "2022-blake3-aes-128-gcm"
serverKey = "auto"
managed = true

# VLESS-Reality 模板。privateKey/shortId 按 Entry 首次生成并加密保存。
[protocols.vless]
flow = "xtls-rprx-vision"
privateKey = "auto"
shortId = "auto"
serverName = "itunes.apple.com"
handshakeServer = "itunes.apple.com"
handshakePort = 443
clientFingerprint = "chrome"
